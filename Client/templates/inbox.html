<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #007bff;
            margin-bottom: 20px;
            text-align: center;
        }

        .conversation-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            background-color: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conversation-info {
            font-size: 1rem;
        }

        .conversation-info small {
            color: #888;
            font-size: 0.85rem;
        }

        .view-button {
            background-color: #007bff;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .empty-message {
            color: #666;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 20px;
        }

        @media screen and (max-width: 768px) {
            .container {
                padding: 20px;
            }

            nav a {
                display: block;
                margin: 10px 0;
                text-align: center;
            }

            .conversation-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .view-button {
                margin-top: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'client_dash' %}">Dashboard</a>
            <a href="{% url 'profile_page' %}">Profile</a>
            <a href="{% url 'createGig' %}">Post New Gig</a>
            <a href="{% url 'viewGig' %}">My Gigs</a>
            <a href="{% url 'inbox_view' %}">Inbox</a>
            <a href="{% url 'client_orders' %}">Orders</a>
            <a href="{% url 'client_reviews' %}">Reviews</a>
            <a href="{% url 'client_logout' %}">Logout</a>
        </nav>
    </header>

    <div class="container">
        <h2>Your Conversations</h2>

        {% for convo in conversations %}
            <div class="conversation-card">
                <div class="conversation-info">
                    <strong>{{ convo.freelancer.username }}</strong><br>
                    <small>Started: {{ convo.started_at|date:"M d, Y" }}</small>
                </div>
                <a href="{% url 'conversation' convo.id %}" class="view-button">View</a>
            </div>
        {% empty %}
            <p class="empty-message">You have no active conversations yet.</p>
        {% endfor %}
    </div>
</body>
</html>
