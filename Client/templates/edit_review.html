<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Review — GigHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #0f172a;
      color: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .brand span {
      color: #38bdf8;
    }

    .nav a {
      display: block;
      padding: 12px;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
      font-size: 14px;
    }

    .nav a:hover {
      background: rgba(56,189,248,0.2);
      color: #38bdf8;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 25px;
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 20px;
      text-align: center;
    }

    /* LABEL */
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: rgba(255,255,255,0.8);
    }

    /* INPUT */
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input:focus,
    textarea:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: none;
      min-height: 120px;
    }

    /* BUTTON */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .error {
      color: #ef4444;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .success {
      color: #22c55e;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="brand">Gig<span>Hub</span></div>

  <div class="nav">
    <a href="{% url 'client_dash' %}">Dashboard</a>
    <a href="{% url 'profile_page' %}">Profile</a>
    <a href="{% url 'viewGig' %}">My Gigs</a>
    <a href="{% url 'inbox_view' %}">Inbox</a>
    <a href="{% url 'client_orders' %}">Orders</a>
    <a href="{% url 'client_reviews' %}">Reviews</a>
    <a href="{% url 'client_logout' %}">Logout</a>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="card">

    <h2>Edit Review</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    {% if message %}
      <div class="success">{{ message }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <label for="rating">Rating (1 - 10)</label>
      <input type="number" id="rating" name="rating" value="{{ review.rating }}" min="1" max="10" required>

      <label for="comment">Comment</label>
      <textarea name="comment" required>{{ review.comment|escape }}</textarea>

      <button type="submit" class="btn">Update Review</button>
    </form>

  </div>

</div>

</body>
</html>
