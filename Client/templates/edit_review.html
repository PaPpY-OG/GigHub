{% extends 'base.html' %}

{% block title %}Edit Review — GigHub{% endblock %}

{% block css %}
  <style>
    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    /* CARD */
    .card {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 25px;
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 20px;
      text-align: center;
    }

    /* LABEL */
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: rgba(255,255,255,0.8);
    }

    /* INPUT */
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input:focus,
    textarea:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: none;
      min-height: 120px;
    }

    /* BUTTON */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .error {
      color: #ef4444;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .success {
      color: #22c55e;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }
  </style>
{% endblock %}

{% block content %}
<!-- MAIN -->
<div class="main">

  <div class="card">

    <h2>Edit Review</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    {% if message %}
      <div class="success">{{ message }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <label for="rating">Rating (1 - 10)</label>
      <input type="number" id="rating" name="rating" value="{{ review.rating }}" min="1" max="10" required>

      <label for="comment">Comment</label>
      <textarea name="comment" required>{{ review.comment|escape }}</textarea>

      <button type="submit" class="btn">Update Review</button>
    </form>
  </div>
</div>
{% endblock %}
