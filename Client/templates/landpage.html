<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        * {
        box-sizing: border-box;
        }
        body {
            background: white;
            margin: 0;
            padding: 0;
        }
        .container {
            border: #0977c0;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 0 25px rgba(3, 34, 209, 0.3);
            font-family: Arial, Helvetica, sans-serif;
            width: 350px;
            margin: 100px auto;
            text-align: center;
        }
        .container h2 {
            margin-bottom: 15px;
            color: #0977c0;
        }
        .container p {
            margin: 10px 0;
            color: #0977c0;
        }
        .btn-group {
            margin-top: 20px;
        }   
        .btn {
            display: inline-block;
            padding: 10px 28px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            background-color: #0977c0;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: rgb(41, 145, 231);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Wagwan MyGee!</h2>
        <p>Welcome to Pappy Gighub</p>
        <p>Who are you?</p>
        <div class="btn-group">
            <a href="/client/signup/" class="btn">Client</a>
            <a href="/freelancer/signup/" class="btn">Freelancer</a>
        </div>
    </div>
</body>
</html>
