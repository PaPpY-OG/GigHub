{% extends 'base.html' %}

{% block title %}Edit Gig — GigHub{% endblock %}

{% block css %}
  <style>
    /* MAIN */
    .main {
      flex: 1;
      padding: 30px;
    }

    .title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    /* CARD */
    .card {
      max-width: 650px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      color: #38bdf8;
      margin-bottom: 15px;
    }

    /* MESSAGE */
    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .error {
      background: rgba(255,0,0,0.1);
      border: 1px solid rgba(255,0,0,0.3);
      color: #ff6b6b;
    }

    .success {
      background: rgba(0,255,0,0.1);
      border: 1px solid rgba(0,255,0,0.3);
      color: #38bdf8;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      margin: 10px 0 6px;
      opacity: 0.85;
    }

    input, textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row div {
      flex: 1;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }
  </style>
{% endblock %}

{% block content %}
<!-- MAIN -->
<div class="main">

  <div class="title">Edit Gig</div>

  {% if error %}
    <div class="message error">{{ error }}</div>
  {% endif %}

  {% if message %}
    <div class="message success">{{ message }}</div>
  {% endif %}

  <div class="card">

    <h2>Update Gig Details</h2>

    <form method="POST">
      {% csrf_token %}

      <label>Title</label>
      <input type="text" name="title" value="{{ gig.title }}" required>

      <label>Category</label>
      <input type="text" name="category" value="{{ gig.category }}">

      <div class="row">
        <div>
          <label>Budget Min</label>
          <input type="number" name="budget_min" value="{{ gig.budget_min }}" required>
        </div>

        <div>
          <label>Budget Max</label>
          <input type="number" name="budget_max" value="{{ gig.budget_max }}" required>
        </div>
      </div>

      <label>Description</label>
      <textarea name="description" rows="5">{{ gig.description }}</textarea>

      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
