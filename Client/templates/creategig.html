{% extends "base.html" %}

{% block title %}Post Gig — GigHub{% endblock %}

{% block css %}
  <style>
    /* MAIN */
    .title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    /* FORM CARD */
    .form-card {
      max-width: 650px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .error {
      background: rgba(255,0,0,0.1);
      border: 1px solid rgba(255,0,0,0.3);
      color: #ff6b6b;
    }

    .success {
      background: rgba(0,255,0,0.1);
      border: 1px solid rgba(0,255,0,0.3);
      color: #38bdf8;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      margin: 10px 0 6px;
      opacity: 0.9;
    }

    input, textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row div {
      flex: 1;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }
  </style>
{% endblock %}

{% block content %}
<!-- MAIN -->
<div class="main">

  <div class="title">Post a New Gig</div>

  {% if error %}
    <div class="message error">{{ error }}</div>
  {% endif %}

  {% if message %}
    <div class="message success">{{ message }}</div>
  {% endif %}

  <div class="form-card">

    <form method="POST">
      {% csrf_token %}

      <label>Gig Title</label>
      <input type="text" name="title" required placeholder="e.g. Build a Django Website">

      <label>Category</label>
      <input type="text" name="category" placeholder="e.g. Web Development">

      <div class="row">
        <div>
          <label>Budget Min ($)</label>
          <input type="number" name="budget_min" required>
        </div>

        <div>
          <label>Budget Max ($)</label>
          <input type="number" name="budget_max" required>
        </div>
      </div>

      <label>Description</label>
      <textarea name="description" rows="5" placeholder="Describe your project in detail..."></textarea>

      <button type="submit">Post Gig</button>
    </form>
  </div>
</div>
{% endblock %}
