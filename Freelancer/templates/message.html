<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inbox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .brand span {
            color: #38bdf8;
        }

        .nav a {
            display: block;
            padding: 12px;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav a:hover {
            background: rgba(56,189,248,0.2);
            color: #38bdf8;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 30px;
        }

        h2 {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        /* CARD */
        .conversation-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .conversation-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .conversation-info strong {
            color: #38bdf8;
            font-size: 15px;
        }

        .conversation-info small {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }

        .view-button {
            background: #38bdf8;
            color: black;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .view-button:hover {
            background: #0ea5e9;
        }

        .empty-message {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-top: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">Gig<span>Hub</span></div>

        <div class="nav">
            <a href="{% url 'freelancer_dash' %}">Dashboard</a>
            <a href="{% url 'Fprofile_page' %}">Profile</a>
            <a href="{% url 'active_gigs' %}">Active Gigs</a>
            <a href="{% url 'my_bids' %}">My Bids</a>
            <a href="{% url 'freelancer_orders' %}">Orders</a>
            <a href="{% url 'freelancer_logout' %}">Logout</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <h2>Your Conversations</h2>

        {% for convo in conversations %}
            <div class="conversation-card">
                <div class="conversation-info">
                    <strong>{{ convo.client.username }}</strong><br>
                    <small>Started: {{ convo.started_at|date:"M d, Y" }}</small>
                </div>

                <a href="{% url 'conversations' convo.id %}" class="view-button">
                    View
                </a>
            </div>
        {% empty %}
            <p class="empty-message">You have no active conversations yet.</p>
        {% endfor %}

    </div>

</body>
</html>
