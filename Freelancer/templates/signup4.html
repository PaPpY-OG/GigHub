<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freelancer Signup — GigHub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    h1 span {
      color: #38bdf8;
    }

    p {
      opacity: 0.8;
      margin-bottom: 25px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 14px;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    input {
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: white;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    .btn {
      background: #38bdf8;
      color: black;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }

    .link {
      display: block;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }

    .link:hover {
      color: #38bdf8;
    }

    .brand {
      position: absolute;
      top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .brand span {
      color: #38bdf8;
    }
  </style>
</head>

<body>

  <div class="brand">Gig<span>Hub</span></div>

  <p>Create an account to start applying for gigs and showcasing your skills</p>

  {% if error %}
    <p style="color: #ff6b6b;">{{ error }}</p>
  {% endif %}

  <div class="container">
    <form method="POST">
      {% csrf_token %}

      <label>Email</label>
      <input type="email" name="email" required />

      <label>Password</label>
      <input type="password" name="password1" required />

      <label>Confirm Password</label>
      <input type="password" name="password2" required />

      <button class="btn" type="submit">Create Account</button>
    </form>

    <a class="link" href="/freelancer/login/">Already have an account? Login</a>
  </div>

</body>
</html>
