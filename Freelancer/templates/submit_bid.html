<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Submit Bid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .brand span {
            color: #38bdf8;
        }

        .nav a {
            display: block;
            padding: 12px;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav a:hover {
            background: rgba(56,189,248,0.2);
            color: #38bdf8;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 30px;
        }

        .card {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 14px;
        }

        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error { color: #ff6b6b; }
        .success { color: #38bdf8; }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="brand">Gig<span>Hub</span></div>

    <div class="nav">
        <a href="{% url 'freelancer_dash' %}">Dashboard</a>
        <a href="{% url 'Fprofile_page' %}">Profile</a>
        <a href="{% url 'active_gigs' %}">Active Gigs</a>
        <a href="{% url 'my_bids' %}">My Bids</a>
        <a href="{% url 'freelancer_orders' %}">Orders</a>
        <a href="{% url 'message_view' %}">Inbox</a>
        <a href="{% url 'freelancer_logout' %}">Logout</a>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    {% if error %}
        <div class="message error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="message success">{{ success }}</div>
    {% endif %}

    <div class="card">

        <h2>Submit Bid</h2>
        <p style="text-align:center; color:#94a3b8; margin-bottom:15px;">
            {{ gig.title }}
        </p>

        <form method="POST">
            {% csrf_token %}

            <label>Amount</label>
            <input type="number" name="amount" required>

            <label>Days</label>
            <input type="number" name="days" required>

            <label>Cover Letter</label>
            <textarea name="cover_letter" rows="5" required></textarea>

            <button type="submit">Submit Bid</button>
        </form>

    </div>

</div>

</body>
</html>
